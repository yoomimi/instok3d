# Backbone fine-tuning and Stage 1, 8 views: ScanNet + ScanNet++ (RGB only); validation on
# the ScanNet val scenes.
_target_: instok3d.data.unified.UnifiedSceneDataModule
batch_size: 16
eval_batch_size: -1
num_workers: 8
input_hw: [256, 256]
target_hw: [256, 256]

view_samplers:
  standard_8view:
    num_views: 8
    train_strides: [2, 4]
    eval_stride: 2

data_sources:
  - name: scannet
    view_sampler: standard_8view
    dataset_root: datasets/scannetv2
    gt_subdir: gt_h5
    invalid_json_path: assets/scannet_invalid_frames.json
    split_last_n_val: 50
    frame_load_stride: 10
    train_epoch_size: 5000
    phases: [train, val]
  - name: scannetpp
    view_sampler: standard_8view
    dataset_root: datasets/scannetpp
    gt_subdir: scannetpph5_256
    val_scene_list_path: nvs_sem_val.txt
    frame_load_stride: 1
    train_epoch_size: 5000
    phases: [train]

dataset:
  _target_: .UnifiedSceneDataset
  _provider_: true
  num_views: 8
