# Backbone fine-tuning and Stage 1, 2 views: ScanNet + ScanNet++ (RGB only); validation on
# the 40-scene ScanNet test split.
_target_: instok3d.data.multi.ComposedTrainEvalDataModule
batch_size: 8
eval_batch_size: -1
train_dm_name: scannet
eval_display: eval/scannet_test
val_include_train: false

train_dm:
  _target_: instok3d.data.unified.UnifiedSceneDataModule
  batch_size: ${..batch_size}
  eval_batch_size: ${..eval_batch_size}
  num_workers: 8
  input_hw: [256, 256]
  target_hw: [256, 256]

  view_samplers:
    paired_2view_scannet:
      kind: scannet
      llff_hold: 8
      test_ids: [1, 4]
    paired_2view_scannetpp:
      kind: scannetpp
      min_gap: 5
      max_gap: 15

  data_sources:
    - name: scannet
      view_sampler: paired_2view_scannet
      dataset_root: datasets/scannetv2
      gt_subdir: gt_h5
      invalid_json_path: assets/scannet_invalid_frames.json
      split_last_n_val: 50
      frame_load_stride: 10
      repeat: 8
      phases: [train]
    - name: scannetpp
      view_sampler: paired_2view_scannetpp
      dataset_root: datasets/scannetpp
      gt_subdir: scannetpph5_256
      val_scene_list_path: nvs_sem_val.txt
      frame_load_stride: 1
      repeat: 8
      phases: [train]

  dataset:
    _target_: .UnifiedSceneDataset
    _provider_: true
    num_views: 2

eval_dm:
  _target_: instok3d.data.scannet_lsm_test.ScanNetLSMTestDataModule
  batch_size: 1
  eval_batch_size: 1
  num_workers: 8
  dataset_root: datasets/scannet_test
  dataset:
    _target_: .ScanNetLSMTestDataset
    _provider_: true
    target_hw: [256, 256]
    num_views: 2
    crop_mode: pp_square
    invalid_json_path: assets/scannet_invalid_frames.json
