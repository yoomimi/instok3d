# RealEstate10K, 2 context views (Table 5).
#   python evaluate.py eval_re10k e.load=logs/<run>
dm: re10k_test
solver: tokenizer_re10k
model: tokenizer
backbone: vggt_intr_re10k
eval: unified_vis

is_best: true         # for training runs: best-score checkpoint (true) or last.ckpt (false)
data_indices: null    # e.g. 0,8,16 or 0-39; null evaluates every sample
stage: test
seed: 0
gpus: 1

checkpoint:
  save_dir: checkpoints
  mode: max
